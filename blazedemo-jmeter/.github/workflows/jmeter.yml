name: JMeter Performance

on:
  push:
  workflow_dispatch:

jobs:
  jmeter-perf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run JMeter Test
        uses: QAInsights/PerfAction@v5.6.2
        with:
          test-plan-path: './jmeter/test-plan.jmx'
          args: '-n -t ./jmeter/test-plan.jmx -l ./results/results.jtl -e -o ./reports'

      - name: Upload JMeter Reports
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-reports
          path: reports/
